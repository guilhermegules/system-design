<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620"
     viewBox="0 0 820 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="820" height="620" fill="#f8fafc"/>
  <text x="410" y="44" text-anchor="middle" font-size="24" font-weight="700"
        fill="#0f172a">Layered (N-tier) Architecture</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#64748b">
    requests flow top-down; each layer only knows the layer below
  </text>

  <rect x="300" y="96" width="220" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="410" y="125" text-anchor="middle" font-size="15" font-weight="600"
        fill="#0c4a6e">HTTP client</text>

  <line x1="410" y1="142" x2="410" y2="172" stroke="#334155" stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="240" y="174" width="340" height="66" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="262" y="202" font-size="16" font-weight="700" fill="#1e3a8a">controller</text>
  <text x="262" y="224" font-size="13" fill="#3730a3">
    ProductController, OrderController · DTO mapping, validation</text>

  <line x1="410" y1="240" x2="410" y2="270" stroke="#334155" stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="240" y="272" width="340" height="66" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="262" y="300" font-size="16" font-weight="700" fill="#14532d">service</text>
  <text x="262" y="322" font-size="13" fill="#166534">
    ProductService, OrderService · business rules, transactions</text>

  <line x1="410" y1="338" x2="410" y2="368" stroke="#334155" stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="240" y="370" width="340" height="66" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="262" y="398" font-size="16" font-weight="700" fill="#713f12">repository</text>
  <text x="262" y="420" font-size="13" fill="#854d0e">
    ProductRepository, OrderRepository · Spring Data JPA</text>

  <line x1="410" y1="436" x2="410" y2="466" stroke="#334155" stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="240" y="468" width="340" height="66" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="262" y="496" font-size="16" font-weight="700" fill="#7f1d1d">entity</text>
  <text x="262" y="518" font-size="13" fill="#991b1b">
    Product, Order, OrderItem · shared persistence model</text>

  <line x1="410" y1="534" x2="410" y2="560" stroke="#334155" stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="340" y="562" width="140" height="42" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="410" y="589" text-anchor="middle" font-size="15" font-weight="600"
        fill="#1e293b">H2 database</text>
</svg>
