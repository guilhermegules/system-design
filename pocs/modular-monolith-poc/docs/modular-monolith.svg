<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600"
     viewBox="0 0 940 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="dashed" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#f8fafc"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700"
        fill="#0f172a">Modular Monolith</text>
  <text x="470" y="60" text-anchor="middle" font-size="14" fill="#64748b">
    one deployment · business modules · public APIs + application events
  </text>

  <rect x="30" y="84" width="880" height="500" rx="18" fill="none" stroke="#64748b"
        stroke-width="2" stroke-dasharray="8 6"/>
  <text x="470" y="106" text-anchor="middle" font-size="13" font-weight="600"
        fill="#475569">Spring Boot application · :8081</text>

  <rect x="60" y="130" width="200" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="160" y="158" text-anchor="middle" font-size="15" font-weight="700"
        fill="#0c4a6e">catalog</text>
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#075985">
    ProductApi · products</text>

  <rect x="60" y="300" width="200" height="74" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="160" y="328" text-anchor="middle" font-size="15" font-weight="700"
        fill="#78350f">inventory</text>
  <text x="160" y="350" text-anchor="middle" font-size="12" fill="#92400e">
    StockApi · reservation</text>

  <rect x="370" y="130" width="200" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="470" y="158" text-anchor="middle" font-size="15" font-weight="700"
        fill="#14532d">orders</text>
  <text x="470" y="180" text-anchor="middle" font-size="12" fill="#166534">
    OrderApi · lifecycle</text>

  <rect x="680" y="300" width="200" height="74" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="780" y="328" text-anchor="middle" font-size="15" font-weight="700"
        fill="#831843">payment</text>
  <text x="780" y="350" text-anchor="middle" font-size="12" fill="#9d174d">
    PaymentApi · charges</text>

  <rect x="370" y="440" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="470" y="466" text-anchor="middle" font-size="15" font-weight="700"
        fill="#4c1d95">events</text>
  <text x="470" y="488" text-anchor="middle" font-size="12" fill="#6d28d9">
    OrderPlacedEvent · PaymentCompleted · PaymentFailed</text>

  <line x1="370" y1="167" x2="265" y2="167" stroke="#16a34a" stroke-width="2"
        marker-end="url(#arrow)"/>
  <text x="318" y="158" text-anchor="middle" font-size="11" fill="#15803d">ProductApi</text>

  <line x1="570" y1="167" x2="680" y2="300" stroke="#9333ea" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#dashed)"/>
  <text x="636" y="218" text-anchor="middle" font-size="11" fill="#9333ea">OrderPlacedEvent</text>

  <line x1="160" y1="300" x2="160" y2="204" stroke="#9333ea" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#dashed)"/>
  <text x="330" y="262" text-anchor="middle" font-size="11" fill="#9333ea">OrderPlacedEvent</text>

  <line x1="780" y1="300" x2="470" y2="167" stroke="#9333ea" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#dashed)"/>
  <text x="700" y="218" text-anchor="middle" font-size="11" fill="#9333ea">PaymentCompleted | Failed</text>

  <rect x="680" y="440" width="200" height="70" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="780" y="466" text-anchor="middle" font-size="15" font-weight="700"
        fill="#1e293b">shared</text>
  <text x="780" y="488" text-anchor="middle" font-size="12" fill="#334155">
    Money · NotFoundException (leaf)</text>

  <line x1="680" y1="475" x2="575" y2="475" stroke="#475569" stroke-width="2"
        marker-end="url(#arrow)"/>
</svg>